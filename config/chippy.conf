CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY=20

# --- Bluetooth stability ---
# Max TX power: ZMK recommends this for split halves; improves link strength
# between the two sides with negligible extra power draw.
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_TX_PWR_PLUS_12=y
# Enables connection-parameter changes that ZMK plans to make default; their
# stated purpose is to improve connection stability. (Also forces 2M PHY off.)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# Explicitly disable the 2Mbps PHY. Some hosts (Windows w/ Realtek/Intel
# radios, older Intel Macs) connect/stay-connected far more reliably without
# it. EXPERIMENTAL_CONN already defaults this to n, but we pin it for clarity.
CONFIG_BT_CTLR_PHY_2M=n

# --- Battery reporting ---
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
